name: Deploy staging
# Disabled until you opt in: Settings -> Secrets and variables -> Actions
#   variables: DEPLOY_STAGING=true   (and MIGRATE_STAGING=true to also push DB migrations)
#   secrets:   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID   (+ STAGING_DB_URL for migrations)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_STAGING == 'true' }}
    name: Migrate · deploy · QA staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci

      - name: Push database migrations to staging
        if: ${{ vars.MIGRATE_STAGING == 'true' }}
        run: npx supabase db push --db-url "$STAGING_DB_URL" --include-all
        env:
          STAGING_DB_URL: ${{ secrets.STAGING_DB_URL }}

      - name: Build + deploy the Worker
        run: npm run deploy:staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - run: npx playwright install --with-deps chromium
      - name: Closed-loop QA against the deployed site (throwaway qa… players)
        run: npm run qa:staging
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-staging
          path: |
            test-results
            /tmp/qa-shots
          retention-days: 7
