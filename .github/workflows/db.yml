name: Database
# Ships supabase/migrations to the live projects so nobody pastes SQL by hand.
#   - push touching supabase/migrations (any branch, incl. work branches) -> applies pending migrations to STAGING
#   - Deploy prod applies them to PROD (see deploy-prod.yml), never this workflow
#   - then drift check: live schema vs a fresh local build of the migrations (prod also nightly, from main)
# Needs repo secret SUPABASE_ACCESS_TOKEN (supabase.com/dashboard/account/tokens).
on:
  push:
    paths: ['supabase/migrations/**', 'tools/db-migrate.mjs', 'tools/db-fingerprint.sql', '.github/workflows/db.yml']
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:

jobs:
  staging:
    if: ${{ github.event_name != 'schedule' }}
    name: Migrate staging
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: { group: db-staging, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/db-migrate.mjs staging
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  drift:
    name: Drift check (live schema vs repo)
    needs: [staging]
    if: ${{ always() && (needs.staging.result == 'success' || needs.staging.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build the repo's schema locally
        run: npx supabase start -x gotrue,realtime,storage-api,imgproxy,kong,mailpit,postgrest,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
      - name: Staging matches this commit's migrations
        if: ${{ github.event_name != 'schedule' }}
        run: node tools/db-migrate.mjs staging --dry-run --drift "$LOCAL_DB"
        env:
          LOCAL_DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Prod matches main's migrations (lists pending ones until Deploy prod applies them)
        if: ${{ github.ref == 'refs/heads/main' }}
        run: node tools/db-migrate.mjs prod --dry-run --drift "$LOCAL_DB"
        env:
          LOCAL_DB: postgresql://postgres:postgres@127.0.0.1:54322/postgres
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
