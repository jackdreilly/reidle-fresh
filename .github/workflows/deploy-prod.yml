name: Deploy prod
# One click: Actions -> Deploy prod -> Run workflow. Ships main to the `reidle` Worker
# (reidle.reillybrothers.net) on Supabase project reidle-prod, applying pending supabase/migrations and
# deploying supabase/functions first.
# Needs repo secrets: CLOUDFLARE_API_TOKEN (Workers Scripts: Edit), CLOUDFLARE_ACCOUNT_ID, SUPABASE_ACCESS_TOKEN,
# GIPHY_API_KEY, GOOGLE_CLIENT_ID/SECRET, RESEND_API_KEY.
# Each successful deploy tags the deployed commit prod-YYYY-MM-DD-N (UTC date, N counts that day's deploys),
# so `git tag -l 'prod-*'` is the prod release history and `git describe --match 'prod-*'` names what's live.
on:
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.ref == 'refs/heads/main' }}
    name: Build · deploy · verify prod
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push the prod-* tag
    env:
      # Public values (they ship in the bundle): reidle-prod URL + publishable key.
      VITE_SUPABASE_URL: https://fjnhsrkjdrmpxidjsfzd.supabase.co
      VITE_SUPABASE_KEY: sb_publishable_mWQa9TDIOYvWTH4VbPP6HA_EW9_CSVO
      # Reidle's Giphy key for /gif (public in the bundle too; kept out of the repo). Unset -> old shared key.
      VITE_GIPHY_API_KEY: ${{ secrets.GIPHY_API_KEY }}
      # Google's own sign-in button (popup names reidle.reillybrothers.net, src/lib/google.ts); public OAuth client id
      VITE_GOOGLE_CLIENT_ID: 372463177232-kt3mgeb46b4mtvk5iijq6jnl8c8i0pmo.apps.googleusercontent.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - name: Build (bundle budget enforced) + pack the Worker
        run: npm run build && npm run build:worker
      - name: Apply pending database migrations to reidle-prod
        run: node tools/db-migrate.mjs prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Auth settings on reidle-prod (guests, account linking, Google, Resend email) from tools/auth-config.mjs
        run: node tools/auth-config.mjs prod
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      - name: Gemini key for Ask Reidog (function secret GEMINI_API_KEY, from the GitHub secret)
        run: '[ -z "$GEMINI_API_KEY" ] || npx supabase secrets set --project-ref fjnhsrkjdrmpxidjsfzd "GEMINI_API_KEY=$GEMINI_API_KEY"'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - name: Deploy edge functions to reidle-prod (push sender, Ask Reidog)
        run: npx supabase functions deploy --project-ref fjnhsrkjdrmpxidjsfzd --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy the Worker
        run: npx --yes wrangler@4.149.0 deploy --name reidle
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Verify the live site serves this build
        run: |
          want=$(grep -o 'assets/index-[^"]*\.js' dist/index.html)
          for i in $(seq 1 12); do
            got=$(curl -fsS "https://reidle.reillybrothers.net/?v=$GITHUB_SHA" | grep -o 'assets/index-[^"]*\.js' || true)
            [ "$got" = "$want" ] && { echo "live: $got"; exit 0; }
            sleep 5
          done
          echo "live site serves '$got', expected '$want'" >&2; exit 1
      - name: Tag the deployed commit (prod-YYYY-MM-DD-N)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          day=$(date -u +%Y-%m-%d)
          n=$(git ls-remote --tags origin "refs/tags/prod-$day-*" | sed -n 's|.*refs/tags/prod-'"$day"'-\([0-9]*\)$|\1|p' | sort -n | tail -1)
          for attempt in 1 2 3; do
            n=$(( ${n:-0} + 1 )); tag="prod-$day-$n"
            git tag -a "$tag" -m "Deployed to prod by $GITHUB_ACTOR ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" "$GITHUB_SHA"
            git push origin "refs/tags/$tag" && { echo "tagged $GITHUB_SHA as $tag"; echo "Tagged \`$tag\`" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
            git tag -d "$tag"
          done
          exit 1
