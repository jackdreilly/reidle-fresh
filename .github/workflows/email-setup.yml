name: Email domain
# Sets up reillybrothers.net in Resend (sign-in emails) and its DNS records in Cloudflare: tools/resend-setup.mjs.
# Needs repo secret RESEND_API_KEY (full access); DNS records are added when CLOUDFLARE_API_TOKEN may edit DNS.
on:
  push:
    branches: [main]
    paths: ['tools/resend-setup.mjs', '.github/workflows/email-setup.yml']
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node tools/resend-setup.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
