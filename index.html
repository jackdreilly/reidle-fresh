<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Reidle</title>
    <meta name="description" content="Reidle is a Wordle clone with a leaderboard, a forced starting word, and very strict rules." />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reidle" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // theme before first paint (src/lib/theme.ts loads the dark palette)
      try {
        var t = localStorage.getItem("reidle:theme") || "light";
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.background = "#0d1117";
        }
      } catch (e) {}
      // errors queue here until src/lib/telemetry.ts loads and reports them
      addEventListener("error", function (e) { (window.__errs = window.__errs || []).push(e.error || e.message); });
      addEventListener("unhandledrejection", function (e) { (window.__errs = window.__errs || []).push(e.reason); });
    </script>
    <style>
      /* Phones are portrait-only. The manifest asks for portrait, but iOS ignores that, so a phone
         turned sideways (touch screen, short landscape viewport) gets this screen instead. Tablets
         and desktops are taller than 500px in landscape and never see it. */
      #rotate { display: none; }
      @media (orientation: landscape) and (pointer: coarse) and (max-height: 500px) {
        #rotate { display: flex; position: fixed; inset: 0; z-index: 2147483647; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: #fff; color: #111827; font: 600 18px/1.4 system-ui, -apple-system, sans-serif; text-align: center; padding: 24px; }
        html[data-theme="dark"] #rotate { background: #0d1117; color: #e6edf3; }
        #rotate svg { width: 56px; height: 56px; animation: rotate-hint 2s ease-in-out infinite; }
        html, body { overflow: hidden; }
      }
      @keyframes rotate-hint { 0%, 30% { transform: rotate(-90deg); } 60%, 100% { transform: rotate(0deg); } }
      @media (prefers-reduced-motion: reduce) { #rotate svg { animation: none; } }
    </style>
  </head>
  <body>
    <div id="rotate" role="alert">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg>
      <div>Turn your phone upright to play Reidle.</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
