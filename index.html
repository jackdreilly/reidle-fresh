<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Reidle</title>
    <meta name="description" content="Reidle is a Wordle clone with a leaderboard, a forced starting word, and very strict rules." />
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <link rel="icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Reidle" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // theme before first paint (src/lib/theme.ts loads the dark palette)
      try {
        var t = localStorage.getItem("reidle:theme") || "light";
        if (t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.dataset.theme = "dark";
          document.documentElement.style.background = "#0d1117";
        }
      } catch (e) {}
      // errors queue here until src/lib/errors.ts loads and reports them
      addEventListener("error", function (e) { (window.__errs = window.__errs || []).push(e.error || e.message); });
      addEventListener("unhandledrejection", function (e) { (window.__errs = window.__errs || []).push(e.reason); });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
